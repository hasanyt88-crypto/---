name: Build APK with Expo

on:
  push:
    branches: [ Hasan ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build APK locally
        run: |
          eas build --local \
            --non-interactive \
            --output=./app.apk \
            --platform=android \
            --profile=preview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app.apk
